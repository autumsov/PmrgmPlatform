<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login PWA - TokoKu</title>
    
    <!-- Apple PWA Tags & Favicon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Toko PWA">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <!-- Preconnect Origins -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tambahan Google Fonts untuk estetika -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-700 via-indigo-600 to-purple-700 p-4 relative overflow-hidden">
    
    <!-- Guard: Jika sudah login, redirect ke index -->
    <script>
        if (localStorage.getItem('token_toko')) {
            window.location.replace('index.html');
        }
    </script>

    <!-- Animasi Background Bulatan Estetik -->
    <div class="absolute top-0 left-0 w-72 h-72 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 right-10 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>

    <div class="glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-sm z-10 transform transition duration-500 hover:scale-[1.02]">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-600 mb-4 shadow-inner rotate-3 hover:rotate-0 transition-transform">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">Login Sistem</h2>
            <p class="text-sm text-gray-500 mt-2 font-medium">Selamat datang! Silakan verifikasi untuk mengakses gudang.</p>
        </div>
        
        <form id="form-login" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Username</label>
                <input type="text" id="username" class="w-full border-2 border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 bg-white/70 rounded-2xl px-4 py-3 transition-all duration-300 outline-none shadow-sm" placeholder="Masukkan username admin" required>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1.5 ml-1">Password</label>
                <input type="password" id="password" class="w-full border-2 border-gray-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 bg-white/70 rounded-2xl px-4 py-3 transition-all duration-300 outline-none shadow-sm" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-login" class="mt-2 w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:bg-indigo-700 hover:shadow-indigo-500/30 focus:ring-4 focus:ring-indigo-200 transition-all duration-300 active:scale-95 flex justify-center items-center group">
                <span>Masuk Sekarang</span>
                <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
            
            <!-- Keterangan Login Demo -->
            <div class="mt-4 text-center bg-indigo-50/80 rounded-xl p-3 border border-indigo-100/50">
                <p class="text-[11px] text-gray-500 font-medium">Data Praktikum (Bisa Digunakan):</p>
                <div class="flex justify-center items-center gap-3 mt-1.5 text-xs font-bold text-indigo-700">
                    <span class="bg-white/80 px-2.5 py-1 rounded shadow-sm border border-indigo-100/30">User: admin</span>
                    <span class="bg-white/80 px-2.5 py-1 rounded shadow-sm border border-indigo-100/30">Pass: 12345</span>
                </div>
            </div>
        </form>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const BASE_URL = isLocal ? '../api-toko' : '/api-toko'; 

        // Notifikasi keamanan jika di-redirect karena akses ditolak
        (function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('denied') === '1') {
                // Bersihkan URL agar parameter tidak terlihat
                window.history.replaceState({}, '', window.location.pathname);
                Swal.fire({
                    icon: 'warning',
                    title: 'Akses Ditolak!',
                    text: 'Anda harus login terlebih dahulu untuk mengakses sistem.',
                    confirmButtonText: 'Mengerti',
                    confirmButtonColor: '#6366f1',
                    customClass: { popup: 'rounded-3xl' }
                });
            }
        })();

        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usr = document.getElementById('username').value;
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            // Loading state
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const res = await fetch(`${BASE_URL}/login.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usr, password: pwd })
                });

                const hasil = await res.json();

                if (hasil.status === 'success') {
                    // Simpan Token
                    localStorage.setItem('token_toko', hasil.token);
                    await Swal.fire({
                        icon: 'success',
                        title: 'Berhasil Login!',
                        text: 'Membuka kunci menuju sistem utama...',
                        timer: 1500,
                        showConfirmButton: false,
                        customClass: { popup: 'rounded-3xl' }
                    });
                    window.location.href = 'index.html'; 
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal',
                        text: hasil.pesan,
                        customClass: { popup: 'rounded-3xl' }
                    });
                }
            } catch (err) { 
                Swal.fire({
                    icon: 'error',
                    title: 'Error Koneksi',
                    text: 'Tidak dapat terhubung ke Server API.',
                    customClass: { popup: 'rounded-3xl' }
                });
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.set(".glass-panel", { y: 50, scale: 0.9, opacity: 0 });
            gsap.set(".animate-blob", { opacity: 0, scale: 0 });
            
            const tl = gsap.timeline();
            tl.to(".animate-blob", { opacity: 0.3, scale: 1, duration: 1.5, stagger: 0.2, ease: "power2.out" })
              .to(".glass-panel", { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.2)" }, "-=1.2");
        });
    </script>
</body>
</html>
